<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 820" width="1240" height="820" role="img"
     aria-label="dormouse architecture: byte input, 32k BPE, 12 hybrid blocks (3 KDA : 1 CSA), MoE FFN with 64 TSCT experts, auxiliary heads, ternary weights and int4 activations">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#8d8474"/>
    </marker>
    <style>
      .t   { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
      .h   { font-size: 15px; font-weight: 600; fill: #201d18; }
      .s   { font-size: 12px; fill: #6b6252; }
      .n   { font-size: 11px; fill: #8d8474; }
      .box { fill: #fbf9f4; stroke: #d9d2c4; stroke-width: 1.2; }
      .acc { fill: #eef4fd; stroke: #2a66c2; stroke-width: 1.4; }
      .qnt { fill: #f4efe6; stroke: #b8ac93; stroke-width: 1.2; stroke-dasharray: 4 3; }
      .ln  { stroke: #8d8474; stroke-width: 1.2; fill: none; marker-end: url(#ar); }
    </style>
  </defs>

  <rect width="1240" height="820" fill="#f6f3ec"/>
  <text x="48" y="46" class="t h" font-size="20">dormouse — the stack</text>
  <text x="48" y="68" class="t s">every box is a slot with one choice; every choice has a measured number behind it</text>

  <!-- input column -->
  <rect x="48" y="104" width="196" height="56" class="t box"/>
  <text x="64" y="128" class="t h">text</text>
  <text x="64" y="146" class="t n">en + ru + code + math</text>

  <rect x="48" y="184" width="196" height="72" class="t box"/>
  <text x="64" y="208" class="t h">BPE 32 768</text>
  <text x="64" y="226" class="t n">byte fallback · own regex</text>
  <text x="64" y="242" class="t n">4.4 bytes / token</text>

  <rect x="48" y="280" width="196" height="56" class="t box"/>
  <text x="64" y="304" class="t h">uint16 stream</text>
  <text x="64" y="322" class="t n">manifest-checked, resumable</text>

  <rect x="48" y="360" width="196" height="72" class="t acc"/>
  <text x="64" y="384" class="t h">embedding</text>
  <text x="64" y="402" class="t n">32 768 × 832 tied</text>
  <text x="64" y="418" class="t n">213 k parameters</text>

  <path class="ln" d="M146,160 L146,182"/>
  <path class="ln" d="M146,256 L146,278"/>
  <path class="ln" d="M146,336 L146,358"/>
  <path class="ln" d="M146,432 L146,470"/>

  <!-- the stack -->
  <rect x="48" y="472" width="640" height="272" class="t box" fill="#fdfcf8"/>
  <text x="64" y="496" class="t h">12 blocks — hybrid 3 : 1</text>

  <!-- KDA block -->
  <rect x="64" y="510" width="284" height="118" class="t acc"/>
  <text x="78" y="532" class="t h">KDA × 3</text>
  <text x="78" y="552" class="t n">delta rule + per-channel decay</text>
  <text x="78" y="570" class="t n">recurrent state, O(1) at any length</text>
  <text x="78" y="596" class="t n">2.23 M params / layer</text>
  <text x="78" y="614" class="t n">no selector — cannot miss a needle</text>

  <!-- CSA block -->
  <rect x="364" y="510" width="308" height="118" class="t acc"/>
  <text x="378" y="532" class="t h">CSA + HCA × 1</text>
  <text x="378" y="552" class="t n">chunked sparse attention, top-k blocks</text>
  <text x="378" y="570" class="t n">coarse level inside the same weights</text>
  <text x="378" y="596" class="t n">1.70 M params / layer</text>
  <text x="378" y="614" class="t n">needle keep-rate 64 / 64, chance 2 / 7</text>

  <!-- FFN -->
  <rect x="64" y="644" width="608" height="84" class="t acc"/>
  <text x="78" y="666" class="t h">MoE FFN — 64 routed experts + 1 shared · top-2 · dropless</text>
  <text x="78" y="686" class="t n">15.34 M per expert · Quantile Balancing · sqrt(softplus) router · RMSNorm</text>
  <text x="78" y="704" class="t n">activation MoA (bi, sigmoid) over gelu / silu / relu² / leaky / tanh / SiTU</text>
  <text x="78" y="720" class="t n">optional TSCT rank 256 inside each expert: −35 % FLOP, +2.2 % BPB</text>

  <!-- right column: numbers -->
  <rect x="712" y="104" width="480" height="164" class="t box"/>
  <text x="730" y="128" class="t h">what it is at d = 832, 12 layers</text>
  <text x="730" y="152" class="t s">stored</text><text x="900" y="152" class="t h">1.00 B</text>
  <text x="730" y="174" class="t s">active per token</text><text x="900" y="174" class="t h">46 M</text>
  <text x="730" y="196" class="t s">FLOP per byte</text><text x="900" y="196" class="t h">62.7 M</text>
  <text x="730" y="218" class="t s">ceiling at 52 % MFU</text><text x="900" y="218" class="t h">0.76 MB/s</text>
  <text x="730" y="240" class="t s">file, ternary</text><text x="900" y="240" class="t h">~250 MB</text>
  <text x="730" y="262" class="t n">10 GB of data ≈ 3.7 h on one 16 GB card</text>

  <!-- quantisation -->
  <rect x="712" y="288" width="480" height="104" class="t qnt"/>
  <text x="730" y="312" class="t h">precision — two axes, both on</text>
  <text x="730" y="334" class="t s">weights</text><text x="830" y="334" class="t h">ternary, from step 0</text>
  <text x="730" y="354" class="t s">activations</text><text x="830" y="354" class="t h">int4 in memory</text>
  <text x="730" y="376" class="t n">masters stay bf16/fp32 — an update of 1e-3 cannot survive a 6.25 % grid</text>

  <!-- aux heads -->
  <rect x="712" y="412" width="480" height="132" class="t box"/>
  <text x="730" y="436" class="t h">auxiliary objectives — they add, never replace</text>
  <text x="730" y="458" class="t s">NTP</text><text x="790" y="458" class="t n">next token — the only source of the shipped loss</text>
  <text x="730" y="480" class="t s">TST</text><text x="790" y="480" class="t n">token superposition: bag of k tokens, mean per-token CE</text>
  <text x="730" y="502" class="t s">JEPA</text><text x="790" y="502" class="t n">latent target on a paired view (question ↔ answer, task ↔ solution)</text>
  <text x="730" y="524" class="t s">LightMTP</text><text x="790" y="524" class="t n">≤ 1 % parameters, predicts its own future hidden state</text>

  <!-- optimizer -->
  <rect x="712" y="564" width="480" height="88" class="t box"/>
  <text x="730" y="588" class="t h">optimizer</text>
  <text x="730" y="610" class="t s">matrices</text><text x="812" y="610" class="t h">Muon</text>
  <text x="868" y="610" class="t n">per-head, 5 Newton–Schulz steps, bf16 state</text>
  <text x="730" y="632" class="t s">vectors, norms, embedding</text><text x="900" y="632" class="t h">AdamW</text>

  <!-- loop / resist -->
  <rect x="712" y="672" width="480" height="72" class="t qnt"/>
  <text x="730" y="696" class="t h">deliberately absent</text>
  <text x="730" y="716" class="t n">loops +0.16 BPB · patches +1.8 BPB · 1024 tiny experts 6.1 kB/s</text>
  <text x="730" y="734" class="t n">each with the measurement that put it here</text>

  <!-- bottom bar -->
  <rect x="48" y="762" width="1144" height="1.2" fill="#d9d2c4"/>
  <text x="48" y="788" class="t n">one card · 16 GB · the whole recipe reproducible from a config and a journal</text>
</svg>
