<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="dormouse — one entry point">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f6f3ec"/>
      <stop offset="1" stop-color="#eae4d8"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="320" fill="url(#bg)"/>
  <rect x="84" y="76" width="6" height="168" fill="#2f6fd0"/>

  <text x="120" y="140" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
