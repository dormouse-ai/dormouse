    <text x="700" y="160">plan</text>
    <text x="700" y="188">train</text>
    <text x="700" y="216">run</text>
    <text x="700" y="244">eval</text>
  </g>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" fill="#8d8474">
    <text x="900" y="132">serve</text>
    <text x="900" y="160">export</text>
    <text x="900" y="188">tokenize</text>
    <text x="900" y="216">audit</text>
