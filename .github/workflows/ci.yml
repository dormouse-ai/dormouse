name: ci

on:
  push:
    branches: [master]
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUNBUFFERED: "1"

jobs:
  test:
    name: py${{ matrix.python }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13", "3.14", "3.15"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.6"
          cache-dependency-glob: uv.lock
      # The lockfile is the install: --frozen refuses a stale one instead of
      # resolving, and the CPU torch index is declared once, in pyproject.toml.
      - run: uv sync --frozen --extra dev
      - name: lint
        run: uv run --no-sync ruff check .
      - name: format
        run: uv run --no-sync ruff format --check .
      - name: types
        run: uv run --no-sync mypy src
      - name: tests
        run: uv run --no-sync python -m pytest --cov --cov-report=term-missing

  gates:
    name: invariant gates
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.6"
          cache-dependency-glob: uv.lock
      - run: uv sync --frozen --extra dev
      # Alone, so a red invariant is a named check: a metric cannot be zero over a
      # non-empty window, and a one-entry dictionary is the plain FFN bit for bit.
      - name: the invariants
        run: uv run --no-sync python -m pytest tests/gates -q

  regression:
    name: quality regression
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.6"
          cache-dependency-glob: uv.lock
      - run: uv sync --frozen
      # The only check that can see "learning broke": 200 seeded steps, fp32, one
      # CPU thread, on the committed 2 MB slice. The band and its provenance are in
      # tools/regression.py.
      - name: 200 seeded steps against the recorded loss
        run: uv run --no-sync python tools/regression.py

  build:
    name: build the wheel
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install build
      - run: python -m build
      # CPU torch, so the smoke install does not pull 3 GB of CUDA wheels to prove
      # that an entry point prints --help.
      - name: the wheel installs and its entry point answers in a clean venv
        run: |
          python -m venv "${RUNNER_TEMP}/smoke"
          "${RUNNER_TEMP}/smoke/bin/pip" install --index-url https://download.pytorch.org/whl/cpu torch
          "${RUNNER_TEMP}/smoke/bin/pip" install "dist/"*.whl
          "${RUNNER_TEMP}/smoke/bin/dorm" --help > /dev/null
      # Every run keeps the wheel it built, so a reviewer can download exactly the
      # artifact these checks ran against.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error
          retention-days: 14

  audit:
    name: audit the dependency closure
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install pip-audit
      # Audit the project, not a throwaway env: that is the set users resolve, it
      # covers torch (a `2.15.0+cpu` build in an env is invisible to PyPI advisories),
      # and it keeps build tools out of a security gate.
      - name: audit the dependencies this package declares
        run: pip-audit .
