# chat_50m_b64: the same 61.35M-token recipe at b16 x s512, with the global attention slot moved from DSA to CSA + HCA.
# Six KDA layers carry the short range; one CSA (16-token blocks) and one HCA
# (128-token coarse blocks) carry the long range. The period tiles all 8 layers.
unit = "bpe"
tokenizer = "data-prep-2h/tokenizer32k.json"
attn = "hybrid"
attn_pattern = ["kda", "kda", "kda", "kda", "kda", "kda", "csa", "hca"]
ffn = "dense"
ffn_tsct_rank = 256
optimizer = "muon"
objective = "ntp"
weight_qat = "ternary_native"
act_quant = "a4"
torch_compile = false
sources = "corpus"
device = "auto"
muon_ns_dtype = "fp32"

d_model = 512
n_layers = 8
n_heads = 8
n_kv_heads = 2
head_dim = 64
c_lat = 128
d_ffn = 2048
n_experts = 0
topk = 0
n_shared = 0
expert_tsct_rank = 0
attn_k = 256
attn_window = 64
seq_len = 512
batch = 64
block_checkpoint = true
chunked_loss = true

tokens = 16_416_000
lr_muon = 0.00025
lr_adamw = 0.0001
schedule = "cosine"
# Warmup is budget-relative: 748 steps at 7,489 steps, 2 at a 20-step `--smoke`.
seed = 7
harness = false
eval_every = 0
ckpt_every = 500
eval_batches = 2
eval = "../../data-prep-2h/demo_heldout.bin"

# The last stage has no `until`: it covers the 7,489-step budget and a 20-step
# `--smoke` budget alike.
[[stage]]
name = "corpus"

[[source]]
path = "../../data-prep-2h/demo_pretrain.bin"
weight = 1.0
stage = "corpus"
