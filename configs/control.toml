# control: the dense stack the kitchen sink is measured against.
#
# Every slot is the arm that adds no mechanism:
#   attn=full       dense causal attention with RoPE (model/attn.py)
#   ffn=gated       SwiGLU at the parameter-neutral width (2·832·3072 = 3·832·2048)
#   optimizer=muon  the same two-arm update, so the optimizer is not a variable
#   objective=ntp   next-token cross-entropy
#   no quantization
#
# The difference between this file and kitchen_sink.toml is exactly the stack: the two
# files agree on unit, optimizer, objective, sources and every width that is not the
# arm's own (d_ffn is the FFN width here, the expert width there).

unit = "byte"
attn = "full"
ffn = "gated"
activation = "none"
expert_tsct_rank = 0
optimizer = "muon"
objective = "ntp"
weight_qat = "none"
act_quant = "none"
torch_compile = false
sources = "corpus"

d_model = 832
n_layers = 12
n_heads = 13
head_dim = 64
d_ffn = 2048
seq_len = 1024
batch = 24

tokens = 10_000_000_000
throughput_tflops = 1.0
