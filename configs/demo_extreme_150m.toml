# demo_extreme_150m: the 150M-active / sub-1B-stored variant priced on meta device.
#
# This is a CONFIG VARIANT, not a trained checkpoint in this demo. Same architecture and
# the same measured 25%-SYNTH stream as demo_200m.toml. The "10B total" target in the
# brief cannot be built on this stack: 10B stored params alone are ~20 GB in bf16 before
# optimizer state or activations, three times the 16 GB card. The honest stored count
# for 154.7M active here is 838M (8 experts would cut stored but not add active size).
# No Engram LUT/RAG is implemented: both would be new mechanisms, not surviving levers.
# The G0 bill (executed FLOP/token) is met by the same engine bill as demo_200m.

unit = "bpe"
tokenizer = "data-prep-2h/tokenizer32k.json"
attn = "hybrid"
optimizer = "muon"
objective = "ntp"
weight_qat = "none"
act_quant = "none"
torch_compile = false
sources = "corpus"
device = "auto"
muon_ns_dtype = "fp16"

d_model = 2048
n_layers = 12
n_heads = 8
n_kv_heads = 2
head_dim = 64
c_lat = 512
d_ffn = 12288
n_experts = 64
topk = 2
n_shared = 1
expert_tsct_rank = 256
attn_k = 512
attn_window = 128
seq_len = 1024
batch = 2

tokens = 1_228_800
throughput_tflops = 36.7264
schedule = "cosine"
seed = 7
harness = false
eval_every = 150
ckpt_every = 150
eval_batches = 4
eval = "../data-prep-2h/demo_heldout.bin"

[[source]]
path = "../data-prep-2h/demo_pretrain.bin"
weight = 1.0
