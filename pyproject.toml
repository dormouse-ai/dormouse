[project]
name = "dormouse"
version = "0.1.0"
description = "The one entry point: train, run, eval, serve, export, status."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "dormouse-core @ git+https://github.com/dormouse-ai/dormouse-core@master",
  "numpy>=1.26",
  "tokenizers>=0.23",
  "torch>=2.5",
]

[project.scripts]
dorm = "dormouse.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "hypothesis>=6", "mypy>=1.11", "ruff>=0.17.6"]
model = ["torch>=2.13"]

[build-system]
requires = ["setuptools>=84.2.1"]
build-backend = "setuptools.build_meta"

# The CPU wheel index, declared once. `uv sync --frozen` installs the CPU torch
# from here; nothing else in the repo repeats the URL.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q --strict-markers --strict-config"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "RET", "SIM", "PTH", "RUF", "D"]
ignore = ["D203", "D213", "N818"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D", "RUF002", "RUF003"]
# The train package's docstrings are derivations. `σ`, `×` and `–` there are notation,
# not typos: rewriting them as ASCII turns the formulas into something read as code.
"src/dormouse/train/*" = ["RUF002", "RUF003"]
# `tsct.py` holds the variance derivation that fixes the init scale; `σ`, `√` and `Σ`
# are the notation of it.
"src/dormouse/model/tsct.py" = ["RUF002", "RUF003"]
# `kernels/bank.py`'s docstring is the tile arithmetic of the fused chain; `×`, `σ`,
# `α` and `−` there are notation, not typos in prose, exactly as in `train/*`.
"src/dormouse/kernels/bank.py" = ["RUF002", "RUF003"]
# `kda.py`'s docstring is the chunk algebra of eq. 2-9: `α`, `β`, `Γ`, `Σ`, `⊙` and `ᵀ`
# there are the paper's notation, which is the point of writing the derivation down.
"src/dormouse/model/attn_variants/kda.py" = ["RUF002", "RUF003"]
# The anchors print the papers' own equations; `α`, `β`, `σ`, `∪` there are notation,
# not ambiguous ASCII that should be rewritten.
"src/dormouse/verify/*" = ["RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.12"
strict = true

[[tool.mypy.overrides]]
module = ["torch", "torch.*", "triton", "triton.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["dormouse.model.*"]
disallow_subclassing_any = false

# The optimizers subclass `torch.optim.Optimizer`; torch ships its types only in the
# stub package, so the base resolves to Any under `ignore_missing_imports`.
[[tool.mypy.overrides]]
module = ["dormouse.train.*"]
disallow_subclassing_any = false

[tool.coverage.run]
source = ["dormouse"]

# The measured number on master 2026-11-15 (Python 3.15, full suite) was 94.77%.
# The floor sits just below it, so an honest regression fails the build and a
# refactor that drops a line does not.
[tool.coverage.report]
fail_under = 93
show_missing = true
