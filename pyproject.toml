[project]
name = "dormouse"
version = "0.1.0"
description = "The one entry point: train, run, eval, serve, export, status."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "dormouse-core @ git+https://github.com/dormouse-ai/dormouse-core@master",
  "numpy>=1.26",
  "torch>=2.5",
]

[project.scripts]
dorm = "dormouse.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8", "hypothesis>=6", "mypy>=1.11", "ruff>=0.6"]
model = ["torch>=2.13"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q --strict-markers --strict-config"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "RET", "SIM", "PTH", "RUF", "D"]
ignore = ["D203", "D213", "N818"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D"]

[tool.mypy]
python_version = "3.12"
strict = true

[[tool.mypy.overrides]]
module = ["torch", "torch.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["dormouse.model.*"]
disallow_subclassing_any = false
